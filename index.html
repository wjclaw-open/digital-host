<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数字主持人 · 小薇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #b478ff;
    --accent-light: #d4a0ff;
    --accent-dim: rgba(180,120,255,0.15);
    --accent-glow: rgba(180,120,255,0.4);
    --bg-deep: #0b0816;
    --bg-card: rgba(20,14,38,0.6);
    --bg-surface: rgba(255,255,255,0.04);
    --text: #e4e0f0;
    --text-dim: rgba(200,190,230,0.5);
    --border: rgba(180,120,255,0.12);
    --success: #4ade80;
    --danger: #f44747;
    --pink: #ff6b9d;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background:
      radial-gradient(ellipse 600px 400px at 20% 15%, rgba(180,120,255,0.07) 0%, transparent 100%),
      radial-gradient(ellipse 500px 500px at 80% 85%, rgba(68,138,255,0.06) 0%, transparent 100%),
      radial-gradient(ellipse 400px 300px at 50% 50%, rgba(255,100,180,0.04) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
    animation: bgShift 20s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0% { transform: translate(0,0) rotate(0deg); }
    100% { transform: translate(-30px, -20px) rotate(2deg); }
  }

  /* ===== Header ===== */
  #header {
    background: rgba(12,8,24,0.75);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }
  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .avatar {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #b478ff 0%, #e94560 50%, #ff6b9d 100%);
    background-size: 200% 200%;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 16px var(--accent-glow), 0 0 32px rgba(180,120,255,0.15);
    animation: avatarPulse 4s ease-in-out infinite;
  }
  @keyframes avatarPulse {
    0%,100% { box-shadow: 0 0 16px var(--accent-glow), 0 0 32px rgba(180,120,255,0.15); background-position: 0% 50%; }
    50% { box-shadow: 0 0 24px rgba(180,120,255,0.55), 0 0 48px rgba(180,120,255,0.2); background-position: 100% 50%; }
  }
  .status-dot {
    position: absolute; bottom: 0; right: 0;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--success);
    border: 2px solid var(--bg-deep);
    box-shadow: 0 0 6px rgba(74,222,128,0.5);
  }
  .status-dot.speaking {
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
    animation: statusPulse 0.8s ease-in-out infinite;
  }
  @keyframes statusPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.3); }
  }
  .header-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .header-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.8px; }
  .header-subtitle { font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
  .ctrl-btns { display: flex; gap: 8px; }
  .ctrl-btn {
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--bg-surface);
    color: #999; font-size: 11px; cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    backdrop-filter: blur(8px);
    position: relative; overflow: hidden;
    user-select: none;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.08); color: #ccc; border-color: rgba(255,255,255,0.18); }
  .ctrl-btn.on { background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.3); color: var(--success); }
  .ctrl-btn.playing { background: var(--accent-dim); border-color: rgba(180,120,255,0.35); color: var(--accent); }
  .ctrl-btn.playing::after {
    content: ''; position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor;
    animation: playingDot 1.2s ease-in-out infinite;
  }
  @keyframes playingDot {
    0%,80%,100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  /* ===== Main Layout ===== */
  #main { flex: 1; display: flex; overflow: hidden; position: relative; z-index: 1; }

  /* ===== Left Panel (Chat) ===== */
  #leftPanel {
    flex: 1;
    display: flex; flex-direction: column; min-width: 0;
    background: rgba(16,10,30,0.35);
    backdrop-filter: blur(16px);
    border-right: 1px solid var(--border);
  }
  .tts-bar {
    height: 2px; background: rgba(180,120,255,0.2);
    width: 100%; position: relative; overflow: hidden;
    display: none; flex-shrink: 0;
  }
  .tts-bar.active { display: block; }
  .tts-bar::after {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: tts-wave 1.5s linear infinite;
  }
  @keyframes tts-wave { 0%{left:-60%} 100%{left:100%} }

  #ttsNotice {
    text-align: center; color: var(--accent); font-size: 11px;
    padding: 6px 16px; background: rgba(180,120,255,0.06);
    border-bottom: 1px solid rgba(180,120,255,0.08);
    display: none; flex-shrink: 0; letter-spacing: 0.3px;
  }

  /* ===== Chat Area ===== */
  #chat {
    flex: 1; padding: 20px 16px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(180,120,255,0.2); border-radius: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }

  /* Messages */
  .msg {
    max-width: 78%;
    line-height: 1.6;
    font-size: 14px;
    word-break: break-word;
    padding: 12px 16px;
    opacity: 0;
    transform: translateY(12px) scale(0.97);
    animation: msgIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
    position: relative;
  }
  @keyframes msgIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg .time {
    font-size: 10px; opacity: 0.35;
    margin-top: 6px; display: block;
    text-align: right; letter-spacing: 0.3px;
  }

  .msg.ai {
    align-self: flex-start;
    background: linear-gradient(135deg, rgba(28,22,48,0.92), rgba(20,30,52,0.92));
    border: 1px solid rgba(180,120,255,0.15);
    border-radius: 4px 18px 18px 18px;
    color: #d0d8e8;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15), 0 0 20px rgba(180,120,255,0.03);
  }
  .msg.ai::before {
    content: ''; position: absolute;
    top: 0; left: 0; width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--accent), rgba(148,80,224,0.6));
    border-radius: 4px 0 0 18px;
  }
  .msg-ai-label {
    font-size: 11px; color: var(--accent); opacity: 0.6;
    margin-bottom: 4px; display: flex; align-items: center; gap: 4px;
    font-weight: 500;
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(160,90,240,0.9), rgba(130,60,200,0.9));
    border-radius: 18px 18px 4px 18px;
    color: #fff;
    box-shadow: 0 2px 16px rgba(180,120,255,0.2);
  }
  .msg.user::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
    border-radius: inherit; pointer-events: none;
  }

  /* Typing indicator */
  .typing-indicator {
    align-self: flex-start;
    padding: 14px 20px;
    background: linear-gradient(135deg, rgba(28,22,48,0.92), rgba(20,30,52,0.92));
    border: 1px solid rgba(180,120,255,0.15);
    border-radius: 4px 18px 18px 18px;
    display: none;
    align-items: center; gap: 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .typing-indicator.visible { display: flex; }
  .typing-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); opacity: 0.4;
    animation: typingBounce 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Welcome */
  .welcome {
    text-align: center; padding: 40px 20px 20px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    flex: 1; justify-content: center;
  }
  .welcome-icon {
    font-size: 48px; display: block;
    animation: welcomeFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 4px 12px rgba(180,120,255,0.3));
  }
  @keyframes welcomeFloat {
    0%,100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-8px) rotate(2deg); }
    75% { transform: translateY(-4px) rotate(-1deg); }
  }
  .welcome-title {
    font-size: 22px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-light), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .welcome-sub {
    font-size: 13px; color: var(--text-dim); line-height: 1.6;
  }
  .quick-phrases {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 8px;
  }
  .quick-phrase {
    padding: 8px 16px; border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-dim); font-size: 12px;
    cursor: pointer; transition: all 0.25s;
    user-select: none;
  }
  .quick-phrase:hover {
    background: var(--accent-dim);
    border-color: rgba(180,120,255,0.3);
    color: var(--accent-light);
    transform: translateY(-1px);
  }

  /* ===== Input Bar ===== */
  #inputBar {
    background: rgba(12,8,24,0.7);
    backdrop-filter: blur(20px);
    padding: 12px 16px 14px;
    display: flex; gap: 10px; align-items: center;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #chatIn {
    flex: 1; padding: 11px 18px;
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    color: var(--text); font-size: 14px;
    outline: none;
    transition: all 0.3s;
  }
  #chatIn:focus {
    border-color: rgba(180,120,255,0.5);
    background: rgba(255,255,255,0.06);
    box-shadow: 0 0 0 3px rgba(180,120,255,0.08), 0 0 20px rgba(180,120,255,0.06);
  }
  #chatIn::placeholder { color: rgba(255,255,255,0.2); }

  .input-actions { display: flex; gap: 6px; align-items: center; }
  #resetBtn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.08);
    background: var(--bg-surface);
    color: #666; font-size: 14px;
    cursor: pointer; transition: all 0.25s;
    display: flex; align-items: center; justify-content: center;
  }
  #resetBtn:hover { color: var(--danger); border-color: rgba(244,71,71,0.3); background: rgba(244,71,71,0.08); }

  #chatBtn {
    padding: 10px 24px;
    border-radius: 24px;
    border: none;
    background: linear-gradient(135deg, #b478ff, #8b40e0);
    color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 2px 12px rgba(180,120,255,0.25);
    position: relative; overflow: hidden;
    min-width: 72px; text-align: center;
  }
  #chatBtn::before {
    content: ''; position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  #chatBtn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(180,120,255,0.35); }
  #chatBtn:hover::before { opacity: 1; }
  #chatBtn:active { transform: translateY(0); }
  #chatBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  #chatBtn .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Right Panel (3D) ===== */
  #rightPanel {
    width: 400px; flex-shrink: 0;
    background: radial-gradient(ellipse at 50% 40%, rgba(26,14,50,0.7) 0%, rgba(10,8,22,0.9) 100%);
    position: relative; overflow: hidden;
    border-left: 1px solid var(--border);
  }
  #rightPanel::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 100%, rgba(180,120,255,0.04) 0%, transparent 60%);
    pointer-events: none; z-index: 1;
  }
  #threeContainer { width: 100%; height: 100%; }

  .name-card {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 5; pointer-events: none;
    text-align: center;
    background: rgba(20,14,40,0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(180,120,255,0.15);
    border-radius: 16px;
    padding: 10px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 40px rgba(180,120,255,0.05);
  }
  .name-card-name {
    font-size: 15px; font-weight: 700;
    color: #e0d0ff;
    text-shadow: 0 0 16px rgba(180,120,255,0.4);
    display: flex; align-items: center; gap: 6px; justify-content: center;
  }
  .name-card-status {
    font-size: 11px; color: var(--text-dim); margin-top: 2px;
    display: flex; align-items: center; gap: 4px; justify-content: center;
  }
  .name-card-status .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 4px rgba(74,222,128,0.4);
  }
  .name-card-status .dot.speaking {
    background: var(--accent);
    box-shadow: 0 0 4px var(--accent-glow);
    animation: statusPulse 0.8s ease-in-out infinite;
  }
  #speechTag {
    font-size: 11px; color: var(--accent);
    opacity: 0; transition: all 0.3s;
    margin-top: 4px;
  }
  #speechTag.visible { opacity: 1; }

  /* ===== Settings Modal ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100; backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.3s;
  }
  .modal-overlay.show { display: block; opacity: 1; }
  .modal-box {
    display: none; position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%) scale(0.92);
    z-index: 101; width: 440px; max-width: 90vw;
    background: rgba(22,14,42,0.97);
    border: 1px solid rgba(180,120,255,0.18);
    border-radius: 20px;
    padding: 32px;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 60px rgba(180,120,255,0.06);
    opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-box.show {
    display: block; opacity: 1;
    transform: translate(-50%,-50%) scale(1);
  }
  .modal-title {
    font-size: 18px; font-weight: 700; color: #fff;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #fff, var(--accent-light));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .modal-desc { font-size: 12px; color: var(--text-dim); margin-bottom: 24px; }
  .modal-divider { height: 1px; background: var(--border); margin: 20px 0; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 500;
    color: rgba(200,190,230,0.6); margin-bottom: 6px;
    letter-spacing: 0.3px;
  }
  .field input {
    width: 100%; padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: #fff; font-size: 14px; outline: none;
    transition: all 0.3s;
  }
  .field input:focus {
    border-color: rgba(180,120,255,0.5);
    box-shadow: 0 0 0 3px rgba(180,120,255,0.08), 0 0 16px rgba(180,120,255,0.06);
  }
  .field input::placeholder { color: rgba(255,255,255,0.18); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .modal-btn {
    padding: 10px 24px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.25s;
  }
  .modal-btn.cancel {
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--bg-surface); color: #888;
  }
  .modal-btn.cancel:hover { background: rgba(255,255,255,0.06); color: #aaa; }
  .modal-btn.save {
    border: none;
    background: linear-gradient(135deg, #b478ff, #e94560);
    color: #fff;
    box-shadow: 0 2px 12px rgba(180,120,255,0.2);
  }
  .modal-btn.save:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(180,120,255,0.3); }
  .modal-btn.save:active { transform: translateY(0); }
  #cfgStatus {
    margin-top: 14px; font-size: 12px; text-align: center;
    padding: 8px; border-radius: 8px;
    display: none;
  }
  #cfgStatus.success { display: block; background: rgba(74,222,128,0.08); color: var(--success); }
  #cfgStatus.error { display: block; background: rgba(244,71,71,0.08); color: var(--danger); }

  /* ===== Responsive ===== */
  @media (max-width: 800px) {
    #main { flex-direction: column-reverse; }
    #rightPanel {
      width: 100%; height: 45vh; min-height: 280px;
      flex-shrink: 0; border-left: none;
      border-top: 1px solid var(--border);
    }
    #leftPanel { border-right: none; }
    #header { padding: 8px 14px; }
    .header-name { font-size: 14px; }
    .header-subtitle { display: none; }
    .ctrl-btn { padding: 6px 10px; font-size: 10px; }
    .name-card { bottom: 12px; padding: 8px 18px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="avatar-wrap">
    <div class="avatar">👩</div>
    <div class="status-dot" id="statusDot"></div>
  </div>
  <div class="header-info">
    <div class="header-name">小薇</div>
    <div class="header-subtitle">AI 数字主持人</div>
  </div>
  <div class="ctrl-btns">
    <button class="ctrl-btn on" id="autoplayBtn" onclick="toggleAutoplay()">
      <span id="autoplayText">🔊</span> 自动播放
    </button>
    <button class="ctrl-btn" onclick="openSettings()">⚙ 设置</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="leftPanel">
    <div class="tts-bar" id="ttsBar"></div>
    <div id="ttsNotice">正在为您朗读...</div>
    <div id="chat">
      <div class="welcome" id="welcomeArea">
        <span class="welcome-icon">🌸</span>
        <div class="welcome-title">你好，我是小薇</div>
        <div class="welcome-sub">AI 数字主持人，随时为你服务</div>
        <div class="quick-phrases">
          <div class="quick-phrase" onclick="quickSend('你好呀')">你好呀</div>
          <div class="quick-phrase" onclick="quickSend('介绍一下自己')">介绍一下自己</div>
          <div class="quick-phrase" onclick="quickSend('讲个笑话吧')">讲个笑话吧</div>
          <div class="quick-phrase" onclick="quickSend('今天天气怎么样')">今天天气怎么样</div>
        </div>
      </div>
      <!-- Typing indicator -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>
    <div id="inputBar">
      <input id="chatIn" placeholder="输入消息..." onkeydown="if(event.key==='Enter')window.sendChat()">
      <div class="input-actions">
        <button id="resetBtn" onclick="resetChat()" title="重置对话">↺</button>
        <button id="chatBtn" onclick="window.sendChat()">发送</button>
      </div>
    </div>
  </div>

  <div id="rightPanel">
    <div id="threeContainer"></div>
    <div class="name-card">
      <div class="name-card-name">🌸 小薇</div>
      <div class="name-card-status">
        <span class="dot" id="avatarDot"></span>
        <span id="avatarStatusText">在线</span>
      </div>
      <div id="speechTag">🎤 正在说话...</div>
    </div>

const pl = new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16), iris);

  pos[i*3+1] = (Math.random()-0.5)*8 + 2;
  pos[i*3+2] = (Math.random()-0.5)*10;
  sizes[i] = Math.random() * 0.02 + 0.008;
}
pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
pg.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

let floatOffset = 0;
let speaking = false;
let bt = 0, bstate = 0;
let t = 0;
let rotationSpeed = 0;

window.setSpeaking = function(on) {
  speaking = on;
  const tag = document.getElementById('speechTag');
  const dot = document.getElementById('avatarDot');
  const statusText = document.getElementById('avatarStatusText');
  const headerDot = document.getElementById('statusDot');
  if(on) {
    tag.classList.add('visible');
    dot.classList.add('speaking');
    statusText.textContent = '说话中';
    headerDot.classList.add('speaking');
  } else {
    tag.classList.remove('visible');
    dot.classList.remove('speaking');
    statusText.textContent = '在线';
    headerDot.classList.remove('speaking');
  }
};

function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  if(floating) {
    floatOffset = Math.sin(t*0.8) * 0.08;
    g.position.y = floatOffset;
    rotationSpeed = Math.sin(t*0.4) * 0.02;
  } else {
    g.rotation.y += rotationSpeed;
  }
  g.rotation.y = rotationSpeed;

  if(speaking) {
    const mo = 0.5 + Math.sin(t*7.5) * 0.65;
    llip.position.y = 1.15 - mo*0.025;
    ul.position.y = 1.18 + mo*0.014;
    mi.scale.y = 0.5 + mo*2.8;
    mi.position.y = 1.16 - mo*0.01;
    g.rotation.y += Math.sin(t*5) * 0.008;
  } else {
    llip.position.y = 1.15;
    ul.position.y = 1.18;
    mi.scale.y = 0.5;
    mi.position.y = 1.16;
    rotationSpeed *= 0.92;
  }

  bt += 0.016;
  if(bt > 4+Math.random()*2) { bstate = -1; bt = 0; }
  if(bstate === -1) {
    eyl.scale.y = Math.min(1, eyl.scale.y+0.07);
    eyr.scale.y = Math.min(1, eyr.scale.y+0.07);
    if(eyl.scale.y >= 1) bstate = 1;
  } else if(bstate === 1) {
    if(bt > 0.09) bstate = 0;
  } else {
    eyl.scale.y = Math.max(0.01, eyl.scale.y-0.045);
    eyr.scale.y = Math.max(0.01, eyr.scale.y-0.045);
  }

  pts.rotation.y += 0.0008;
  pts.position.y = floatOffset + Math.sin(t*1.5) * 0.2;
  pts.material.opacity = 0.25 + Math.sin(t*1.8) * 0.15;
  glow.material.opacity = 0.06 + Math.sin(t*1.4) * 0.04;

  renderer.render(scene, camera);
}
animate();

function resize() {
  const w=container.clientWidth, h=container.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
}
window.addEventListener('resize', resize);
setTimeout(resize, 100);

<script>
var SESSION_ID='main', currentAudioId=null, autoplayEnabled=true, currentAudio=null, lastPollId=null, lastAddedText=null;

function fmtTime(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

function addMsg(text, type) {
  if(text===lastAddedText) return;
  lastAddedText = text;
  var chat = document.getElementById('chat');
  var w = chat.querySelector('.welcome');
  if(w) w.style.display = 'none';

  var d = document.createElement('div');
  d.className = 'msg ' + type;
  if(type === 'ai') {
    d.innerHTML = '<div class="msg-ai-label">🌸 小薇</div>' + text + '<span class="time">' + fmtTime() + '</span>';
  } else {
    d.innerHTML = text + '<span class="time">' + fmtTime() + '</span>';
  }
  // Insert before typing indicator
  var typingEl = document.getElementById('typingIndicator');
  chat.insertBefore(d, typingEl);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(show) {
  var el = document.getElementById('typingIndicator');
  if(show) {
    el.classList.add('visible');
    var chat = document.getElementById('chat');
    chat.scrollTop = chat.scrollHeight;
  } else {
    el.classList.remove('visible');
  }
}

function pollTTS(wantId) {
  if(!wantId) return;
  fetch('/tts_status?v='+Date.now()).then(function(r){return r.json();}).then(function(data){
    if(!wantId) return;
    if(data.ready && data.id===wantId) {
      document.getElementById('ttsNotice').style.display='none';
      document.getElementById('ttsBar').classList.remove('active');
      currentAudioId=wantId; playAudio(wantId);
    } else setTimeout(function(){pollTTS(wantId);}, 600);
  }).catch(function(){ if(wantId) setTimeout(function(){pollTTS(wantId);}, 800); });
}

var audioUnlocked = false;
function unlockAudio() {
  if(audioUnlocked) return;
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume().then(function(){ audioUnlocked = true; });
  } catch(e) { audioUnlocked = true; }
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);
document.addEventListener('keydown', unlockAudio);

function playAudio(wantId) {
  fetch('/tts_audio?v='+Date.now()).then(function(r){return r.ok?r.blob():null;}).then(function(blob){
    if(blob && currentAudioId===wantId) {
      if(currentAudio){currentAudio.pause();currentAudio=null;}
      if(window.setSpeaking) window.setSpeaking(true);
      currentAudio = new Audio(URL.createObjectURL(blob));
      if(autoplayEnabled) currentAudio.play();
      document.getElementById('autoplayBtn').classList.add('playing');
      currentAudio.onended = function(){
        if(window.setSpeaking) window.setSpeaking(false);
        document.getElementById('autoplayBtn').classList.remove('playing');
      };
    }
  });
}

function toggleAutoplay() {
  autoplayEnabled = !autoplayEnabled;
  var btn = document.getElementById('autoplayBtn'), text = document.getElementById('autoplayText');
  if(autoplayEnabled) { btn.classList.add('on'); text.textContent='🔊'; }
  else { btn.classList.remove('on'); text.textContent='🔇'; if(currentAudio){currentAudio.pause();currentAudio=null;} }
}

function startAutoPoll() {
  setInterval(function(){
    fetch('/poll?last_id='+(lastPollId||'')).then(function(r){return r.json();}).then(function(data){
      if(data.has_new) {
        lastPollId=data.id; var isAI=data.type==='ai';
        addMsg(data.text, isAI?'ai':'user');
        if(isAI) {
          document.getElementById('ttsNotice').style.display='block';
          document.getElementById('ttsBar').classList.add('active');
          setTimeout(function(){
            fetch('/tts_status?v='+Date.now()).then(function(r){return r.json();}).then(function(s){
              if(s.id){currentAudioId=s.id;pollTTS(currentAudioId);}
            });
          }, 1000);
        } else if(data.tts_id) pollUserTTS(data.tts_id, function(){});
        fetch('/poll/ack',{method:'POST'});
      }
    }).catch(function(){});
  }, 2000);
}
startAutoPoll();

function pollUserTTS(ttsId, onDone) {
  fetch('/tts_status?source=user&v='+Date.now()).then(function(r){return r.json();}).then(function(data){
    if(data.ready && data.id===ttsId) {
      fetch('/tts_audio?source=user&v='+Date.now()).then(function(r){return r.ok?r.blob():null;}).then(function(blob){
        if(blob) {
          if(window.setSpeaking) window.setSpeaking(true);
          var a = new Audio(URL.createObjectURL(blob));
          if(autoplayEnabled) a.play();
          a.onended = function(){ if(window.setSpeaking) window.setSpeaking(false); onDone(); };
        } else onDone();
      });
    } else setTimeout(function(){pollUserTTS(ttsId,onDone);}, 400);
  }).catch(function(){ onDone(); });
}

function sendChat() {
  var input = document.getElementById('chatIn'), btn = document.getElementById('chatBtn'), text = input.value.trim();
  if(!text) return;
  input.value = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  showTyping(true);
  addMsg(text, 'user');

  // Unlock audio on mobile
  try {
    var silence = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
    silence.play().catch(function(){});
    setTimeout(function(){silence.pause();silence=null;},100);
  } catch(e){}

  // Generate user TTS
  fetch('/tts_generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})})
  .then(function(r){return r.json();}).then(function(meta){
    (function pollLocal(){
      fetch('/tts_status?source=user&v='+Date.now()).then(function(r){return r.json();}).then(function(data){
        if(data.ready && data.id===meta.tts_id) {
          fetch('/tts_audio?source=user&v='+Date.now()).then(function(r){return r.ok?r.blob():null;}).then(function(blob){
            if(blob) {
              if(window.setSpeaking) window.setSpeaking(true);
              var ua = new Audio(URL.createObjectURL(blob));
              if(autoplayEnabled) ua.play();
              ua.onended = function(){ if(window.setSpeaking) window.setSpeaking(false); };
            }
            getAI();
          });
        } else setTimeout(pollLocal, 400);
      }).catch(function(){ getAI(); });
    })();
  }).catch(function(){ getAI(); });

  function getAI() {
    fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text,session_id:SESSION_ID})})
    .then(function(r){return r.json();}).then(function(data){
      btn.disabled = false; btn.textContent = '发送';
      showTyping(false);
      if(data.error){ addMsg('出错了：'+data.error, 'ai'); return; }
      addMsg(data.text, 'ai');
      document.getElementById('ttsNotice').style.display='block';
      document.getElementById('ttsBar').classList.add('active');
      fetch('/tts_status?v='+Date.now()).then(function(r){return r.json();}).then(function(s){
        currentAudioId = s.id; pollTTS(currentAudioId);
      });
    }).catch(function(e){
      btn.disabled = false; btn.textContent = '发送';
      showTyping(false);
      addMsg('网络错误：'+e.message, 'ai');
    });
  }
}
window.sendChat = sendChat;

function quickSend(text) {
  document.getElementById('chatIn').value = text;
  sendChat();
}

function resetChat() {
  if(!confirm('确定要重置对话吗？')) return;
  fetch('/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:SESSION_ID})})
  .then(function(r){return r.json();}).then(function(data){
    if(data.ok) {
      var chat = document.getElementById('chat');
      var msgs = chat.querySelectorAll('.msg');
      msgs.forEach(function(m){ m.remove(); });
      var w = chat.querySelector('.welcome');
      if(w) w.style.display = '';
      lastAddedText = null;
    }
  });
}

// Settings
function openSettings() {
  var overlay = document.getElementById('settingsOverlay');
  var modal = document.getElementById('settingsModal');
  overlay.style.display = 'block';
  modal.style.display = 'block';
  requestAnimationFrame(function(){
    overlay.classList.add('show');
    modal.classList.add('show');
  });
  fetch('/api/config').then(function(r){return r.json();}).then(function(d){
    document.getElementById('cfgBaseUrl').value = d.base_url||'';
    document.getElementById('cfgApiKey').value = '';
    document.getElementById('cfgApiKey').placeholder = d.has_key?(d.api_key_masked||'已设置，留空不修改'):'sk-...';
    document.getElementById('cfgModel').value = d.model||'';
  });
}

function closeSettings() {
  var overlay = document.getElementById('settingsOverlay');
  var modal = document.getElementById('settingsModal');
  overlay.classList.remove('show');
  modal.classList.remove('show');
  setTimeout(function(){
    overlay.style.display = 'none';
    modal.style.display = 'none';
  }, 300);
  var status = document.getElementById('cfgStatus');
  status.className = ''; status.style.display = 'none';
}

function saveSettings() {
  var url = document.getElementById('cfgBaseUrl').value.trim();
  var key = document.getElementById('cfgApiKey').value;
  var model = document.getElementById('cfgModel').value.trim();
  if(!url || !model){ showCfgStatus('请填写 API 地址和模型名称', 'error'); return; }
  var body = {base_url:url, model:model};
  if(key) body.api_key = key;
  else { showCfgStatus('请填写 API Key', 'error'); return; }
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json();}).then(function(d){
    if(d.ok){ showCfgStatus('保存成功！', 'success'); setTimeout(closeSettings, 1200); }
    else showCfgStatus('保存失败', 'error');
  }).catch(function(e){ showCfgStatus('网络错误', 'error'); });
}

function showCfgStatus(msg, type) {
  var el = document.getElementById('cfgStatus');
  el.textContent = msg;
  el.className = type;
}
</script>
</body>
</html>
